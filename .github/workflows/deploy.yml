name: Deploy
on:
  workflow_run:
    workflows: ['Test']
    branches: [main]
    types:
      - completed
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        # --force skips Vercel's build cache. Production deploys started
        # failing after this repo's next/@sentry/nextjs/postcss version
        # bumps because Vercel kept restoring a build cache from an older
        # deployment predating those bumps, producing a broken hybrid
        # node_modules state that crashed next.config.ts at build time.
        run: vercel --prod --force --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
