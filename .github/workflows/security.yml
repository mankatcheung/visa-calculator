name: Security

on:
  push:
  schedule:
    # Run every Monday at 06:00 UTC to catch newly disclosed vulnerabilities
    # even when the codebase hasn't changed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Audit dependencies for high/critical vulnerabilities
        # yarn audit (Yarn Classic) has no built-in way to allow-list a single advisory, so we
        # filter its --json output ourselves. Both allowed advisories affect extract-zip
        # (GHSA-jmr9-qjv8-65gv, id 1139346, and GHSA-7pqw-9j4j-h8q3, id 1193685) and have no
        # patched release upstream ("patched_versions": "<0.0.0"). extract-zip only reaches us
        # via @lhci/cli's Lighthouse tooling, a devDependency that extracts a Chromium binary
        # fetched by Puppeteer itself during local CI runs rather than untrusted zip archives -
        # so we allow those two advisories and fail on any other high/critical finding.
        run: |
          set -o pipefail
          ALLOWED_ADVISORY_IDS='[1139346, 1193685]'
          yarn audit --level high --json > audit.json || true
          UNALLOWED=$(jq -c --argjson allowed "$ALLOWED_ADVISORY_IDS" \
            'select(.type == "auditAdvisory") | select(.data.advisory.id as $id | ($allowed | index($id)) == null)' \
            audit.json)
          if [ -n "$UNALLOWED" ]; then
            echo "$UNALLOWED"
            echo "::error::Unallowed high/critical vulnerabilities found."
            exit 1
          fi
          echo "No unallowed high/critical vulnerabilities found (extract-zip advisories allowed; no upstream patch exists)."
